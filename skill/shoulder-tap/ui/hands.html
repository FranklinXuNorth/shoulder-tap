<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shoulder-tap · 手</title>
<style>
  :root {
    --bg: #eef1f2; --surface: #ffffff; --ink: #14191a; --muted: #5d6b6d; --line: #d3dbdc;
    --accent: #0e7c7b; --accent-ink: #ffffff; --accent-soft: #d9ecec; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1213; --surface: #161c1d; --ink: #e6ecec; --muted: #94a3a4; --line: #2a3435; --accent: #4bb5b2; --accent-ink: #0e1213; --accent-soft: #123231; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 ui-sans-serif, system-ui, "Microsoft YaHei UI", "PingFang SC", sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 26px; margin: 0; }
  .sub { color: var(--muted); margin: 6px 0 24px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .gestures { display: grid; gap: 10px; }
  .g { display: grid; grid-template-columns: 192px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
  @media (max-width: 560px) { .g { grid-template-columns: 1fr; } }
  .g:hover { border-color: var(--accent); }
  .frame { width: 192px; height: 160px; background-repeat: no-repeat; background-size: 1728px 160px; image-rendering: pixelated; }
  .g b { display: block; }
  .g span { color: var(--muted); font-size: 13px; }
  /* 跟桌面端那条字一样：黑框白底的像素框，手旁边一小条。 */
  .caption { display: inline-block; margin-top: 8px; padding: 6px 10px; border: 2px solid #181818; box-shadow: 2px 2px 0 #181818; background: #fff; color: #181818; font: 13px/1.4 ui-monospace, "Fusion Pixel 12px Prop zh_hans", Consolas, monospace; max-width: 100%; }
  h2 { font-size: 15px; margin: 28px 0 8px; }
  .skins { display: grid; gap: 8px; }
  .opt { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt input { accent-color: var(--accent); }
  .opt .frame { width: 48px; height: 40px; margin: 0; background-size: 432px 40px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
  button { font: inherit; padding: 8px 16px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .msg { margin-top: 12px; font-size: 14px; min-height: 1.4em; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 0.88em; }
</style>

<main>
  <div class="row" style="justify-content:space-between">
    <h1 data-t="title"></h1>
    <div class="row"><button id="lang"></button><button class="primary" id="done" data-t="done"></button></div>
  </div>
  <p class="sub" data-t="sub"></p>

  <div class="gestures">
    <div class="g" data-g="tap"><div class="frame"></div><div><b>tap tap</b><span data-t="tapWhy"></span><br><span class="caption" data-t="tapText"></span></div><button data-try="tap" data-t="try"></button></div>
    <div class="g" data-g="pat"><div class="frame"></div><div><b>pat pat</b><span data-t="patWhy"></span><br><span class="caption" data-t="patText"></span></div><button data-try="complete" data-t="try"></button></div>
    <div class="g" data-g="snap"><div class="frame"></div><div><b>snap</b><span data-t="snapWhy"></span><br><span class="caption" data-t="snapText"></span></div><button data-try="snap" data-t="try"></button></div>
  </div>

  <h2 data-t="skinH"></h2>
  <div class="skins" id="skins"></div>
  <p class="hint" data-t="skinHint"></p>
  <div class="msg" id="msg"></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const T = {
    zh: { title: "手", sub: "点一行看动作，「桌面上试」是真的拍。选一套你想看到的样子。", done: "完成", lang: "English", try: "桌面上试",
      tapWhy: "跑偏了 / 习惯到点", patWhy: "模型在等你回答", snapWhy: "这轮做完了",
      tapText: "喝水 —— 45 分钟没动了", patText: "这条算完成了吗？", snapText: "做完了：README 加了卸载那节", noDesktop: "这台机器没装桌面端。",
      skinH: "样式", skinHint: "想加一套：在 ui/sprites/skins/ 下建个文件夹，放 tap.png、pat.png、snap.png（各 864×80，9 帧）。", saved: "换好了，下次拍就是它。", fail: "没成功" },
    en: { title: "Hands", sub: "Click a row to play; “Try on desktop” really taps. Pick the look you want.", done: "Done", lang: "中文", try: "Try on desktop",
      tapWhy: "drifted / habit due", patWhy: "model is waiting for you", snapWhy: "turn finished",
      tapText: "Drink water — 45 min overdue", patText: "Is this one done?", snapText: "Done: README got an uninstall section", noDesktop: "No desktop app on this machine.",
      skinH: "Style", skinHint: "To add one: make a folder under ui/sprites/skins/ with tap.png, pat.png, snap.png (864×80, 9 frames each).", saved: "Switched. Next tap uses it.", fail: "Failed" },
  };
  // 嵌在设置页里时：没有自己的标题栏和语言按钮，语言由外面那页传进来。
  const q = new URLSearchParams(location.search);
  if (q.has("embed")) { document.querySelector("main > .row").style.display = "none"; document.querySelector("main").style.padding = "22px"; }
  let lang = q.get("lang") || localStorage.getItem("lang") || (navigator.language.startsWith("zh") ? "zh" : "en");
  const t = (k) => T[lang][k];
  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-t]").forEach((el) => el.textContent = t(el.dataset.t));
    $("lang").textContent = t("lang");
  }
  $("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; localStorage.setItem("lang", lang); applyLang(); };

  // 帧时刻跟桌面端一样：拍三下 1.3 秒；响指两张图来回切，4fps。
  const ENDS = { tap: [250, 340, 430, 580, 670, 760, 910, 1000, 1300], pat: [250, 340, 430, 580, 670, 760, 910, 1000, 1300], snap: [250, 500, 750, 1000, 1250, 1500, 1750, 2000, 2250] };
  let skin = "glove";
  const url = (s, g) => `/skins/${s}/${g}.png`;
  const timers = {};
  function play(card) {
    const g = card.dataset.g, el = card.querySelector(".frame");
    clearTimeout(timers[g]);
    const t0 = performance.now();
    const tick = () => {
      const i = ENDS[g].findIndex((e) => performance.now() - t0 < e);
      el.style.backgroundPosition = `-${(i < 0 ? 8 : i) * 192}px 0`;
      if (i >= 0) timers[g] = setTimeout(tick, 16);
    };
    tick();
  }
  function showSkin() {
    document.querySelectorAll(".g").forEach((c) => {
      const el = c.querySelector(".frame");
      el.style.backgroundImage = `url(${url(skin, c.dataset.g)})`;
      el.style.backgroundPosition = "0 0";
    });
  }
  document.querySelectorAll(".g").forEach((c) => c.onclick = () => play(c));
  document.querySelectorAll("[data-try]").forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    const mode = b.dataset.try, text = t({ tap: "tapText", complete: "patText", snap: "snapText" }[mode]);
    try { const r = await api("POST", "/api/tap", { mode, text }); $("msg").textContent = r.tapped ? "" : t("noDesktop"); }
    catch (err) { $("msg").textContent = err.message; }
  });

  const api = async (method, path, body) => {
    const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || t("fail"));
    return j;
  };
  async function load() {
    const s = await api("GET", "/api/hands");
    skin = s.skin;
    $("skins").innerHTML = s.skins.map((name) => `<label class="opt"><input type="radio" name="skin" value="${name}" ${name === skin ? "checked" : ""}><div class="frame" style="background-image:url(${url(name, "tap")})"></div><b>${name}</b></label>`).join("");
    document.querySelectorAll("input[name=skin]").forEach((r) => r.onchange = async () => {
      try { await api("POST", "/api/hands", { skin: r.value }); skin = r.value; showSkin(); $("msg").textContent = t("saved"); }
      catch (e) { $("msg").textContent = e.message; }
    });
    showSkin();
  }
  $("done").onclick = () => api("POST", "/api/close").finally(() => { document.body.innerHTML = ""; window.close(); });
  applyLang();
  load().catch((e) => $("msg").textContent = e.message);
</script>
</html>
