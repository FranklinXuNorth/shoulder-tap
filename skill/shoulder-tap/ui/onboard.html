<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 shoulder-tap</title>
<style>
  :root {
    --bg: #eef1f2; --surface: #ffffff; --surface-2: #f6f8f8;
    --ink: #14191a; --muted: #5d6b6d; --line: #d3dbdc; --line-strong: #aebabc;
    --accent: #0e7c7b; --accent-ink: #ffffff; --accent-soft: #d9ecec;
    --signal: #c1471d; --signal-soft: #f9e4dc;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1213; --surface: #161c1d; --surface-2: #1b2223;
      --ink: #e6ecec; --muted: #94a3a4; --line: #2a3435; --line-strong: #3d4a4b;
      --accent: #4bb5b2; --accent-ink: #0e1213; --accent-soft: #123231;
      --signal: #e98055; --signal-soft: #35201a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 ui-sans-serif, system-ui, "Microsoft YaHei UI", "PingFang SC", sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 6px 0 24px; }
  ol.steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 20px; }
  ol.steps li { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  ol.steps li.on { background: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .card h2 { font-size: 19px; margin: 0 0 4px; }
  .card .why { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input[type=text], input[type=password], input[type=number], input[type=time], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--surface-2); color: var(--ink); font: inherit;
  }
  textarea { min-height: 120px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .choice { display: grid; gap: 10px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt input { margin-top: 4px; accent-color: var(--accent); }
  .opt b { display: block; font-weight: 600; }
  .opt span { color: var(--muted); font-size: 13.5px; }
  button { font: inherit; padding: 10px 18px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  .nav { display: flex; justify-content: space-between; margin-top: 22px; gap: 10px; }
  .client { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); gap: 12px; }
  .client:first-of-type { border-top: 0; }
  .client small { color: var(--muted); display: block; }
  .ok { color: var(--accent); font-weight: 600; }
  pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; margin: 8px 0 0; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
  .promise { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 0 8px 8px 0; margin-bottom: 16px; font-weight: 600; }
  .promise span { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .msg { margin-top: 12px; font-size: 14px; white-space: pre-wrap; min-height: 1.4em; }
  .msg.err { color: var(--signal); }
  .hidden { display: none; }
  ul.list { padding-left: 18px; margin: 8px 0 0; color: var(--muted); font-size: 14px; }
</style>

<main>
  <div class="row" style="justify-content:space-between;align-items:flex-start">
    <h1 data-t="title"></h1>
    <button id="lang" style="padding:6px 12px;font-size:13px"></button>
  </div>
  <p class="sub" data-t="sub"></p>
  <ol class="steps" id="bar"><li></li><li></li><li></li><li></li><li></li></ol>

  <!-- 1 -->
  <section class="card step" data-step="0">
    <h2 data-t="s0h"></h2>
    <p class="why" data-t="s0why"></p>
    <div id="clients"></div>
    <details>
      <summary data-t="s0more"></summary>
      <label data-t="s0cmd"></label>
      <pre id="cmd"></pre>
      <label data-t="s0codex"></label>
      <pre id="codex"></pre>
      <label data-t="s0agent"></label>
      <pre id="manual"></pre>
      <div class="row" style="margin-top:8px"><button id="copyManual" data-t="copy"></button></div>
    </details>
    <div class="msg" id="msg0"></div>
  </section>

  <!-- 2 -->
  <section class="card step hidden" data-step="1">
    <h2 data-t="s1h"></h2>
    <p class="why" data-t="s1why"></p>
    <label for="hname" data-t="s1name"></label>
    <input type="text" id="hname" data-p="s1ph">
    <label data-t="s1when"></label>
    <div class="row">
      <label class="opt" style="margin:0;flex:1"><input type="radio" name="when" value="every" checked><div><b data-t="every"></b><div class="row"><input type="number" id="every" value="60" min="1" style="width:90px"> <span data-t="min"></span></div></div></label>
      <label class="opt" style="margin:0;flex:1"><input type="radio" name="when" value="at"><div><b data-t="daily"></b><input type="time" id="at" value="22:30"></div></label>
    </div>
    <label data-t="s1kind"></label>
    <div class="choice">
      <label class="opt"><input type="radio" name="kind" value="soft" checked><div><b data-t="soft"></b><span data-t="softWhy"></span></div></label>
      <label class="opt"><input type="radio" name="kind" value="hard"><div><b data-t="hard"></b><span data-t="hardWhy"></span></div></label>
    </div>
    <div class="row" style="margin-top:14px"><button id="tryTap" data-t="tryTap"></button><span class="hint" data-t="tryTapWhy" style="color:var(--muted);font-size:13px"></span></div>
    <div class="msg" id="msg1"></div>
  </section>

  <!-- 3 -->
  <section class="card step hidden" data-step="2">
    <h2 data-t="s2h"></h2>
    <p class="why" data-t="s2why"></p>
    <textarea id="tasks" data-p="s2ph"></textarea>
    <div id="already"></div>
    <div class="msg" id="msg2"></div>
  </section>

  <!-- 4 -->
  <section class="card step hidden" data-step="3">
    <h2 data-t="s3h"></h2>
    <div class="promise"><span data-t="promise" style="display:inline;font-weight:600;color:var(--ink);font-size:15px"></span><span data-t="promiseWhy"></span></div>
    <div class="choice">
      <label class="opt"><input type="radio" name="storage" value="local" checked><div><b data-t="local"></b><span data-t="localWhy"></span></div></label>
      <label class="opt"><input type="radio" name="storage" value="notion"><div><b data-t="notion"></b><span data-t="notionWhy"></span></div></label>
    </div>
    <div id="notionBox" class="hidden">
      <label for="ntoken" data-t="ntoken"></label>
      <input type="password" id="ntoken" placeholder="ntn_…" autocomplete="off">
      <label for="npage" data-t="npage"></label>
      <input type="text" id="npage" placeholder="https://www.notion.so/…">
      <ul class="list">
        <li data-t="n1"></li>
        <li data-t="n2"></li>
        <li data-t="n3"></li>
      </ul>
    </div>
    <div class="msg" id="msg3"></div>
  </section>

  <!-- 5：手势页整个嵌进来（同一个服务），换皮肤、试拍都在里面 -->
  <section class="card step hidden" data-step="4" style="padding:0;overflow:hidden">
    <iframe id="handsFrame" title="hands" style="width:100%;height:760px;border:0;display:block"></iframe>
    <div class="msg" id="msg4"></div>
  </section>

  <section class="card hidden" id="done">
    <h2 data-t="doneH"></h2>
    <p class="why" data-t="doneWhy"></p>
    <a href="/hands" data-t="hands"></a>
  </section>

  <div class="nav" id="nav">
    <button id="back" data-t="back"></button>
    <div class="row">
      <button id="skip" data-t="skip"></button>
      <button class="primary" id="next"></button>
    </div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  // 两种语言，一句话能说完的不写两句。
  const T = {
    zh: {
      title: "设置 shoulder-tap", sub: "五步，都能跳过。之后在托盘点「设置…」回来改。", lang: "English",
      s0h: "接上编程工具", s0why: "让 Claude Code / Codex 看到你今天要做的事。都在这台机器上跑。",
      s0more: "自己动手，或交给模型", s0cmd: "终端里跑：", s0codex: "Codex：加进 ~/.codex/config.toml", s0agent: "或把这段发给你的 coding agent：", copy: "复制",
      connected: "已接上", remote: "接的是旧的远程版", installed: "装了，还没接", missing: "没找到", btnSwap: "换成本机版", btnConnect: "接上", connecting: "接着……",
      copied: "复制好了。", copyFail: "浏览器不让复制，手动选中吧。",
      s1h: "第一个习惯", s1why: "名字你定。它在你有停顿时提一句，不打断你。", s1name: "习惯", s1ph: "喝水、健身、站起来走走", s1when: "什么时候提醒", every: "每隔", min: "分钟", daily: "每天", s1kind: "能不能跳过",
      soft: "软习惯 · 随手就能做", softWhy: "正因为简单，所以不能跳过。到点就提，直到你说做了。喝水这种。",
      hard: "硬习惯 · 看当天情况", hardWhy: "可以说「今天不做」，给个原因，今天不再提。健身这种。",
      s2h: "今天要做的事", s2why: "一行一件，按顺序。第一行是它盯着的那件。", s2ph: "做作品集\n接着做推理编排\n回邮件", already: "今天已记着的（填了新的会替换）",
      s3h: "数据放哪", promise: "你的所有习惯 + 要做的事情的数据不上云。", promiseWhy: "shoulder-tap 没有服务器。数据在这台机器上，或在你自己的 Notion 里。",
      local: "这台机器", localWhy: "一个 JSON 文件，不用配。只在这一台上有。", notion: "我自己的 Notion", notionWhy: "手机上也能看。这台机器直连你的 Notion。",
      ntoken: "Notion integration 密钥（ntn_ 开头）", npage: "一个 Notion 页面的链接",
      n1: "密钥在 notion.so/profile/integrations 新建一个 integration 拿。", n2: "那个页面右上角 ⋯ → Connections → 加上它。", n3: "前面填的习惯和今天的事会一起搬过去。",
      needBoth: "密钥和页面链接都要填。", saving: "设置中……",
      tryTap: "在屏幕上试一下", tryTapWhy: "到点时它就这样拍你。", tapSample: (n) => `${n} —— 该做了`, noDesktop: "这台机器没装桌面端，拍肩只落在聊天里。",
      doneH: "好了", doneWhy: "打开 Claude Code 或 Codex 说一句话。跑偏时屏幕右边会有只手。这页可以关了。", hands: "看看那只手，换个样式 →",
      back: "上一步", skip: "跳过", next: "下一步", finish: "完成", fail: "没成功",
      agentMd: (m) => [
        "# 帮我接上 shoulder-tap 的 MCP（本机 stdio，不经过服务器）", "",
        "Claude Code：", "", "```bash", m.command, "```", "",
        "Codex：加进 ~/.codex/config.toml（已有 [mcp_servers.shoulder-tap] 就替换）", "", "```toml", m.codexBlock, "```", "",
        "接完用 `claude mcp get shoulder-tap` 确认是 stdio、Connected，然后打开设置页让我填剩下的：", "",
        "```bash", `node ${JSON.stringify(m.onboard)}`, "```", "", "最后提醒我重开一次会话。",
      ].join("\n"),
    },
    en: {
      title: "Set up shoulder-tap", sub: "Five steps, all skippable. Come back via “Settings…” in the tray.", lang: "中文",
      s0h: "Connect your coding tool", s0why: "So Claude Code / Codex can see what you're doing today. Everything runs on this machine.",
      s0more: "Do it yourself, or hand it to the model", s0cmd: "In a terminal:", s0codex: "Codex: add to ~/.codex/config.toml", s0agent: "Or paste this to your coding agent:", copy: "Copy",
      connected: "Connected", remote: "Points at the old remote version", installed: "Installed, not connected", missing: "Not found", btnSwap: "Switch to local", btnConnect: "Connect", connecting: "Connecting…",
      copied: "Copied.", copyFail: "Clipboard blocked. Select it by hand.",
      s1h: "First habit", s1why: "Any name. It nudges you at a pause, never mid-task.", s1name: "Habit", s1ph: "drink water, workout, stand up", s1when: "When to remind", every: "Every", min: "min", daily: "Daily at", s1kind: "Can it be skipped?",
      soft: "Soft · quick to do", softWhy: "Simple, so no skipping. Reminds until you say done. Drinking water.",
      hard: "Hard · depends on the day", hardWhy: "You can say “not today” with a reason. Workout.",
      s2h: "Today's tasks", s2why: "One per line, in order. The first is the one it watches.", s2ph: "portfolio\ninference orchestration\nreply to email", already: "Already saved for today (new entries replace these)",
      s3h: "Where data lives", promise: "Your habits and tasks never leave your machine.", promiseWhy: "shoulder-tap has no server. Data stays on this machine or in your own Notion.",
      local: "This machine", localWhy: "One JSON file, nothing to configure. This computer only.", notion: "My own Notion", notionWhy: "Visible on your phone. This machine talks to Notion directly.",
      ntoken: "Notion integration token (starts with ntn_)", npage: "Link to a Notion page",
      n1: "Create an integration at notion.so/profile/integrations to get the token.", n2: "On that page: ⋯ → Connections → add it.", n3: "Habits and tasks from earlier steps move over too.",
      needBoth: "Both token and page link are needed.", saving: "Saving…",
      tryTap: "Try it on screen", tryTapWhy: "This is how it taps you when it's due.", tapSample: (n) => `${n} — time`, noDesktop: "No desktop app on this machine; taps land in the chat only.",
      doneH: "Done", doneWhy: "Say something in Claude Code or Codex. When you drift, a hand shows at the right edge. You can close this page.", hands: "Preview the hand, pick a style →",
      back: "Back", skip: "Skip", next: "Next", finish: "Finish", fail: "Failed",
      agentMd: (m) => [
        "# Connect the shoulder-tap MCP for me (local stdio, no server)", "",
        "Claude Code:", "", "```bash", m.command, "```", "",
        "Codex: add to ~/.codex/config.toml (replace an existing [mcp_servers.shoulder-tap]):", "", "```toml", m.codexBlock, "```", "",
        "Then confirm with `claude mcp get shoulder-tap` (stdio, Connected) and open the settings page so I can fill in the rest:", "",
        "```bash", `node ${JSON.stringify(m.onboard)}`, "```", "", "Finally remind me to restart the session.",
      ].join("\n"),
    },
  };
  let lang = localStorage.getItem("lang") || (navigator.language.startsWith("zh") ? "zh" : "en");
  const t = (k) => T[lang][k];
  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach((el) => el.textContent = t(el.dataset.t));
    document.querySelectorAll("[data-p]").forEach((el) => el.placeholder = t(el.dataset.p));
    $("lang").textContent = t("lang");
    if (S) { renderClients(); renderToday(); }
    show();
  }
  $("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; localStorage.setItem("lang", lang); applyLang(); };

  let step = 0, S = null;
  const api = async (method, path, body) => {
    const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || t("fail"));
    return j;
  };
  const say = (i, text, err = false) => { const m = $("msg" + i); m.textContent = text; m.className = "msg" + (err ? " err" : ""); };

  function show() {
    document.querySelectorAll(".step").forEach((s) => s.classList.toggle("hidden", Number(s.dataset.step) !== step));
    [...$("bar").children].forEach((li, i) => li.classList.toggle("on", i <= step));
    $("back").disabled = step === 0;
    $("next").textContent = step === LAST ? t("finish") : t("next");
    // 手势页到了这一步才加载，语言跟着这页走；已加载就只换语言
    if (step === LAST) { const f = $("handsFrame"), src = `/hands?embed&lang=${lang}`; if (f.getAttribute("src") !== src) f.src = src; }
  }
  const LAST = 4;

  function renderClients() {
    const m = S.mcp;
    $("cmd").textContent = m.command;
    $("codex").textContent = m.codexBlock;
    const manual = t("agentMd")(m);
    $("manual").textContent = manual;
    $("copyManual").onclick = async () => {
      try { await navigator.clipboard.writeText(manual); say(0, t("copied")); }
      catch { say(0, t("copyFail"), true); }
    };
    $("clients").innerHTML = "";
    for (const [key, label] of [["claude", "Claude Code"], ["codex", "Codex"]]) {
      const c = m[key];
      const row = document.createElement("div");
      row.className = "client";
      row.innerHTML = `<div><b>${label}</b><small>${t(c.connected ? "connected" : c.remote ? "remote" : c.installed ? "installed" : "missing")}</small></div>`;
      const btn = document.createElement("button");
      if (c.connected) { btn.textContent = "✓ " + t("connected"); btn.disabled = true; btn.className = "ok"; }
      else {
        btn.textContent = t(c.remote ? "btnSwap" : "btnConnect"); btn.className = "primary"; btn.disabled = !c.installed;
        btn.onclick = async () => {
          btn.disabled = true; say(0, t("connecting"));
          try { say(0, (await api("POST", "/api/mcp", { client: key })).message); await load(); }
          catch (e) { say(0, e.message, true); btn.disabled = false; }
        };
      }
      row.appendChild(btn);
      $("clients").appendChild(row);
    }
  }

  function renderToday() {
    if (!S.today.length) { $("already").innerHTML = ""; return; }
    $("already").innerHTML = `<label>${t("already")}</label><ul class="list">${S.today.map((x) => `<li>${x.done ? "✓ " : ""}${x.task.replace(/</g, "&lt;")}</li>`).join("")}</ul>`;
  }

  async function load() {
    S = await api("GET", "/api/state");
    renderClients(); renderToday();
    document.querySelector(`input[name=storage][value=${S.storage}]`).checked = true;
    $("notionBox").classList.toggle("hidden", S.storage !== "notion");
  }

  document.querySelectorAll("input[name=storage]").forEach((r) => r.onchange = () => $("notionBox").classList.toggle("hidden", r.value !== "notion" || !r.checked));

  // 习惯那一步只试 tap：到点提醒就是这只手。
  $("tryTap").onclick = async () => {
    const name = $("hname").value.trim() || $("hname").placeholder.split(/[,、]/)[0].trim();
    try { const r = await api("POST", "/api/tap", { mode: "tap", text: t("tapSample")(name) }); if (!r.tapped) say(1, t("noDesktop"), true); }
    catch (e) { say(1, e.message, true); }
  };

  /** 每一步「下一步」要做的事。返回 false 就停在这一步。 */
  const save = [
    async () => true,
    async () => {
      const name = $("hname").value.trim();
      if (!name) return true;
      const when = document.querySelector("input[name=when]:checked").value;
      const body = { name, kind: document.querySelector("input[name=kind]:checked").value };
      if (when === "every") body.every_minutes = Number($("every").value) || 60; else body.at = $("at").value;
      say(1, (await api("POST", "/api/habit", body)).message);
      $("hname").value = "";
      return true;
    },
    async () => {
      const tasks = $("tasks").value.split("\n").map((s) => s.trim()).filter(Boolean);
      if (!tasks.length) return true;
      say(2, (await api("POST", "/api/today", { tasks })).message);
      await load();
      return true;
    },
    async () => {
      const mode = document.querySelector("input[name=storage]:checked").value;
      const body = mode === "notion" ? { mode, token: $("ntoken").value, page: $("npage").value } : { mode };
      if (mode === "notion" && (!body.token.trim() || !body.page.trim())) { say(3, t("needBoth"), true); return false; }
      say(3, t("saving"));
      say(3, (await api("POST", "/api/storage", body)).message);
      return true;
    },
    async () => true, // 手：选了就已经存了
  ];

  async function finish() {
    await api("POST", "/api/finish");
    document.querySelectorAll(".step").forEach((s) => s.classList.add("hidden"));
    $("nav").classList.add("hidden");
    $("done").classList.remove("hidden");
    [...$("bar").children].forEach((li) => li.classList.add("on"));
  }

  $("next").onclick = async () => {
    $("next").disabled = true;
    try {
      if (!(await save[step]())) return;
      if (step === LAST) return finish();
      step++; show();
    } catch (e) { say(step, e.message, true); }
    finally { $("next").disabled = false; }
  };
  $("skip").onclick = () => (step === LAST ? finish() : (step++, show()));
  $("back").onclick = () => { if (step > 0) { step--; show(); } };

  applyLang();
  load().then(applyLang).catch((e) => say(0, e.message, true));
</script>
</html>
